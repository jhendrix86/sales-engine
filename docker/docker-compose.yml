version: '3.8'

services:
  sales-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sales-engine
    ports:
      - "8041:8041"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sales
      - REDIS_URL=redis://redis:6379/10
      - HUBSPOT_API_KEY=${HUBSPOT_API_KEY}
      - SALESFORCE_API_KEY=${SALESFORCE_API_KEY}
      - PIPEDRIVE_API_KEY=${PIPEDRIVE_API_KEY}
      - DEBUG=${DEBUG:-false}
      - MARKETING_AUTOMATION_URL=http://marketing-automation-engine:8039
      - REVENUE_OPERATIONS_URL=http://revenue-operations-engine:8036
      - ANALYTICS_ENGINE_URL=http://analytics-engine:8042
    # No depends_on here - postgres/redis moved to shared infra
    # (deploy/docker-compose.infra.yml), a different compose project.
    # Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped

networks:
  os42-shared:
    external: true
