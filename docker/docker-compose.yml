version: '3.8'

services:
  sales-engine:
    build:
      # Workspace root, not just this repo - needed to reach the
      # empire-operators sibling package the Dockerfile copies in (see its
      # own comment for why; content-engine is the reference impl). This
      # context path is relative to this compose file's own location, so
      # `docker compose -f docker/docker-compose.yml build` from
      # sales-engine/ still works unchanged.
      context: ../..
      dockerfile: sales-engine/docker/Dockerfile
    container_name: sales-engine
    ports:
      - "8041:8041"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sales
      - REDIS_URL=redis://redis:6379/10
      - HUBSPOT_API_KEY=${HUBSPOT_API_KEY}
      - SALESFORCE_API_KEY=${SALESFORCE_API_KEY}
      - PIPEDRIVE_API_KEY=${PIPEDRIVE_API_KEY}
      - DEBUG=${DEBUG:-false}
      - MARKETING_AUTOMATION_URL=http://marketing-automation-engine:8039
      - REVENUE_OPERATIONS_URL=http://revenue-operations-engine:8036
      - ANALYTICS_ENGINE_URL=http://analytics-engine:8042
    # No depends_on here - postgres/redis moved to shared infra
    # (deploy/docker-compose.infra.yml), a different compose project.
    # Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8041/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  os42-shared:
    external: true
